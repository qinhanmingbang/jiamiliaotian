<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>小圈子 | Private Circle</title>
<style>
:root{
  --bg:#E8ECE7; --surface:#F7F9F6; --ink:#14302D; --ink-soft:#587570; --line:#C3CFC8;
  --accent:#8A5A20; --accent-ink:#FFF8EC;
  --mine:#1F5F57; --mine-ink:#F2FBF8; --theirs:#FFFFFF;
  --danger:#B0342A; --badge:#C2492F;
  --shadow:0 1px 0 rgba(0,0,0,.04),0 14px 34px -18px rgba(20,48,45,.45);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0F2321; --surface:#152E2B; --ink:#E9E7DB; --ink-soft:#9DB5AE; --line:#2B4B46;
    --accent:#D3A25E; --accent-ink:#1A2A22;
    --mine:#2C7A6D; --mine-ink:#F2FBF8; --theirs:#1D3A36;
    --danger:#F28772; --badge:#E0623F;
    --shadow:0 1px 0 rgba(0,0,0,.2),0 14px 34px -18px rgba(0,0,0,.7);
  }
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{
  background:var(--bg);color:var(--ink);
  font:16px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.btn{border:0;border-radius:6px;padding:9px 16px;font-weight:600;background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{filter:brightness(1.07)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink);font-weight:500}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn.small{padding:4px 10px;font-size:13px;border-radius:5px}
.btn.icon-btn{padding:8px;border-radius:50%;background:transparent;border:1px solid var(--line)}
.btn.icon-btn:hover{background:color-mix(in srgb,var(--accent) 10%,transparent)}

.center{min-height:100dvh;display:grid;place-items:center;padding:20px}
.card{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:28px 26px;box-shadow:var(--shadow)}
.logo{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.logo-title{display:flex;align-items:center;gap:10px;font-size:24px;font-weight:800}
.lang-switch{font-size:13px;color:var(--ink-soft);cursor:pointer;background:none;border:1px solid var(--line);border-radius:12px;padding:2px 8px}

.tabs{display:grid;grid-template-columns:1fr 1fr;border:1.5px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:18px}
.tabs button{border:0;background:transparent;padding:9px;font-weight:600;color:var(--ink-soft)}
.tabs button.on{background:var(--accent);color:var(--accent-ink)}
.field{display:block;margin-bottom:14px}
.field span{display:block;font-size:14px;color:var(--ink-soft);margin-bottom:4px}
.field input{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:6px;background:var(--bg)}
.msg{min-height:1.5em;margin:4px 0 12px;font-size:14px;color:var(--danger)}

#app{display:grid;grid-template-columns:340px 1fr;height:100dvh}
.side{display:flex;flex-direction:column;min-height:0;background:var(--surface);border-right:1px solid var(--line)}
.side-head{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.me{flex:1;min-width:0;display:flex;align-items:center;gap:10px}
.me-info b{display:block;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me-info small{color:var(--ink-soft);font-size:12px}

.av-container{position:relative;width:42px;height:42px;flex:none}
.av{width:100%;height:100%;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:17px;object-fit:cover;background:var(--accent)}
.av-edit{position:absolute;bottom:-2px;right:-2px;background:var(--ink);color:var(--bg);border-radius:50%;width:18px;height:18px;font-size:10px;display:grid;place-items:center;cursor:pointer;border:1px solid var(--surface)}

.side-actions{display:flex;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}
.addpanel{padding:12px 14px;border-bottom:1px solid var(--line);background:var(--bg)}
.addpanel .row{display:flex;gap:8px}
.addpanel input{flex:1;min-width:0;padding:8px 12px;border:1.5px solid var(--line);border-radius:6px;background:var(--surface)}
.side-scroll{flex:1;overflow-y:auto;min-height:0}
.sec{padding:12px 14px 4px;font-size:12px;color:var(--ink-soft);letter-spacing:.06em;text-transform:uppercase}

.item{display:flex;align-items:center;gap:12px;width:100%;padding:11px 14px;background:transparent;border:0;border-bottom:1px solid var(--line);text-align:left}
button.item:hover{background:color-mix(in srgb,var(--accent) 8%,transparent)}
.item.active{background:color-mix(in srgb,var(--accent) 14%,transparent)}
.item .mid{flex:1;min-width:0}
.item .nm{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.item .nm b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.item .pv{display:flex;justify-content:space-between;gap:8px;align-items:center;color:var(--ink-soft);font-size:13px}
.badge{flex:none;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--badge);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}

.chat{display:flex;flex-direction:column;min-height:0;min-width:0}
.placeholder{flex:1;display:grid;place-items:center;color:var(--ink-soft);text-align:center;padding:20px}
.chat-head{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.chat-head .back{display:none;border:0;background:none;font-size:22px;padding:4px}
.chat-head .who{flex:1;min-width:0}
.chat-head .who b{display:block;font-size:16px}
.chat-head .actions{display:flex;gap:8px}

.msgs{flex:1;overflow-y:auto;min-height:0;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.day{align-self:center;margin:8px 0;padding:2px 10px;border-radius:10px;font-size:11px;color:var(--ink-soft);background:color-mix(in srgb,var(--ink) 7%,transparent)}
.row-m{display:flex;flex-direction:column;max-width:min(80%,520px)}
.row-m.mine{align-self:flex-end;align-items:flex-end}
.row-m.them{align-self:flex-start;align-items:flex-start}
.bubble{padding:8px 14px;border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word;font-size:15px}
.mine .bubble{background:var(--mine);color:var(--mine-ink);border-bottom-right-radius:2px}
.them .bubble{background:var(--theirs);border:1px solid var(--line);border-bottom-left-radius:2px}
.bubble img.chat-img{max-width:240px;max-height:240px;border-radius:8px;display:block;cursor:pointer}
.row-m time{font-size:10px;color:var(--ink-soft);margin:2px 4px 0}

.composer{display:flex;align-items:center;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line)}
.composer textarea{flex:1;resize:none;max-height:120px;min-height:40px;padding:8px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);line-height:1.4}
.composer textarea:focus{border-color:var(--accent);outline:none}

/* 音频/视频通话 Modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.75);display:grid;place-items:center;z-index:100;color:#fff}
.call-box{background:var(--surface);color:var(--ink);padding:24px;border-radius:16px;width:90%;max-width:400px;text-align:center;box-shadow:var(--shadow)}
.video-grid{display:grid;grid-template-columns:1fr;gap:10px;width:100%;max-width:600px;background:#000;border-radius:12px;overflow:hidden;position:relative}
.video-grid video{width:100%;height:260px;object-fit:cover;background:#222}

#toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:all .2s;z-index:90}
#toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:760px){
  #app{grid-template-columns:1fr}
  #app .chat{display:none}
  #app.chat-open .side{display:none}
  #app.chat-open .chat{display:flex}
  .chat-head .back{display:block}
}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.81.1/dist/umd/supabase.js"></script>
</head>
<body>

<input type="file" id="fileAvatar" accept="image/*" hidden>
<input type="file" id="fileImage" accept="image/*" hidden>

<!-- 登录/注册 -->
<section id="auth" class="center">
  <div class="card">
    <div class="logo">
      <div class="logo-title">
        <svg width="30" height="30" viewBox="0 0 30 30"><circle cx="15" cy="15" r="13" fill="none" stroke="var(--accent)" stroke-width="2.5"/><circle cx="15" cy="15" r="5" fill="var(--accent)"/></svg>
        <span data-i18n="appName">小圈子</span>
      </div>
      <button class="lang-switch" id="btnLang">English</button>
    </div>
    <p class="sub" style="color:var(--ink-soft);font-size:14px;margin-bottom:16px" data-i18n="appSub">私密通讯与好友社交</p>
    <div class="tabs">
      <button id="tabLogin" class="on" data-i18n="login">登录</button>
      <button id="tabSignup" data-i18n="signup">注册</button>
    </div>
    <div id="signupOnly" hidden>
      <label class="field"><span data-i18n="username">用户名</span>
        <input id="suUser" autocomplete="username" placeholder="e.g. alex"></label>
    </div>
    <label class="field"><span data-i18n="email">邮箱</span>
      <input id="email" type="email" placeholder="name@example.com"></label>
    <label class="field"><span data-i18n="password">密码</span>
      <input id="pw" type="password" placeholder="••••••••"></label>
    <div id="inviteWrap" hidden>
      <label class="field"><span data-i18n="inviteCode">邀请码</span>
        <input id="invite" placeholder="Invite Code"></label>
    </div>
    <div class="msg" id="authMsg"></div>
    <button class="btn" style="width:100%" id="authBtn" data-i18n="login">登录</button>
  </div>
</section>

<!-- 主界面 -->
<section id="app" hidden>
  <aside class="side">
    <div class="side-head">
      <div class="me">
        <div class="av-container">
          <img id="myAvatar" class="av" src="" alt="Avatar" style="display:none">
          <div id="myAvatarTxt" class="av">?</div>
          <div class="av-edit" id="btnChangeAv" title="Change Avatar">📷</div>
        </div>
        <div class="me-info">
          <b id="meName">@user</b>
          <small data-i18n="online">在线</small>
        </div>
      </div>
      <button class="btn ghost small" id="btnLogout" data-i18n="logout">退出</button>
    </div>
    <div class="side-actions">
      <button class="btn" id="btnAddToggle" style="width:100%" data-i18n="addFriend">添加好友</button>
    </div>
    <div class="addpanel" id="addPanel" hidden>
      <div class="row">
        <input id="addInput" placeholder="Username" autocomplete="off">
        <button class="btn" id="btnAdd" data-i18n="apply">发送</button>
      </div>
    </div>
    <div class="side-scroll" id="sideScroll"></div>
  </aside>

  <main class="chat">
    <div class="placeholder" id="chatEmpty">
      <div><div style="font-size:48px">💬</div><p data-i18n="selectFriendHint">选择一位好友开始沟通</p></div>
    </div>
    <div id="chatBox" style="display:none;flex-direction:column;flex:1;min-height:0">
      <div class="chat-head">
        <button class="back" id="btnBack">‹</button>
        <div class="av-container" style="width:36px;height:36px">
          <img id="chatAvImg" class="av" src="" alt="Av" style="display:none">
          <div id="chatAvTxt" class="av">?</div>
        </div>
        <div class="who"><b id="chatName">Friend</b><small id="chatUser">@username</small></div>
        <div class="actions">
          <button class="btn icon-btn" id="btnAudioCall" title="Voice Call">📞</button>
          <button class="btn icon-btn" id="btnVideoCall" title="Video Call">📹</button>
          <button class="btn ghost small" id="btnUnfriend" data-i18n="delete">删除</button>
        </div>
      </div>
      <div class="msgs" id="msgs"></div>
      <div class="composer">
        <button class="btn icon-btn" id="btnSendImg" title="Send Image">🖼️</button>
        <button class="btn icon-btn" id="btnRecordAudio" title="Voice Message">🎤</button>
        <textarea id="input" rows="1" placeholder="Type a message..." maxlength="2000"></textarea>
        <button class="btn" id="btnSend" data-i18n="send">发送</button>
      </div>
    </div>
  </main>
</section>

<!-- 视讯通话 Modal -->
<div class="modal" id="callModal" hidden>
  <div class="call-box" id="callBoxInit">
    <h3 id="callTitle">Calling...</h3>
    <p id="callSub">Waiting for response</p>
    <div class="video-grid" id="videoArea" hidden>
      <video id="remoteVideo" autoplay playsinline></video>
      <video id="localVideo" autoplay playsinline muted style="position:absolute;width:100px;height:100px;bottom:10px;right:10px;border:2px solid #fff;border-radius:8px"></video>
    </div>
    <div style="margin-top:20px;display:flex;justify-content:center;gap:12px">
      <button class="btn" id="btnAcceptCall" style="background:var(--mine);display:none" data-i18n="accept">接听</button>
      <button class="btn" id="btnEndCall" style="background:var(--danger)" data-i18n="hangup">挂断</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
(function(){
'use strict';

/* ================= 在这里配置 SUPABASE 连接信息 ================= */
const SUPABASE_URL = 'https://njhiqptnpwjpqadmhtrl.supabase.co';
const SUPABASE_KEY = 'sb_publishable_OeHjJS4zmhmFwTwf_w3SDg_ovYAwlE9';
/* =============================================================== */

const i18n = {
  zh: {
    appName: "小圈子", appSub: "私密通讯与好友社交", login: "登录", signup: "注册", username: "用户名",
    email: "邮箱", password: "密码", inviteCode: "邀请码", online: "在线", logout: "退出", addFriend: "添加好友",
    apply: "发送", selectFriendHint: "选择一位好友开始沟通", delete: "删除好友", send: "发送", accept: "接听",
    hangup: "挂断", enterUser: "请输入用户名", recordStart: "按住录音...", recording: "正在录音... (点击发送)",
    callAudio: "发起语音通话", callVideo: "发起视频通话", incomingCall: "收到来电"
  },
  en: {
    appName: "Private Circle", appSub: "Private & Secure Messaging", login: "Sign In", signup: "Sign Up", username: "Username",
    email: "Email", password: "Password", inviteCode: "Invite Code", online: "Online", logout: "Logout", addFriend: "Add Friend",
    apply: "Apply", selectFriendHint: "Select a friend to start chatting", delete: "Unfriend", send: "Send", accept: "Accept",
    hangup: "End Call", enterUser: "Enter username", recordStart: "Hold to Record...", recording: "Recording... (Click to Send)",
    callAudio: "Voice Call", callVideo: "Video Call", incomingCall: "Incoming Call"
  }
};

let currentLang = localStorage.getItem('app_lang') || 'zh';
const $ = id => document.getElementById(id);
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

function applyLang(){
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const k = el.getAttribute('data-i18n');
    if(i18n[currentLang][k]) el.textContent = i18n[currentLang][k];
  });
  $('btnLang').textContent = currentLang === 'zh' ? 'English' : '中文';
}
$('btnLang').onclick = () => {
  currentLang = currentLang === 'zh' ? 'en' : 'zh';
  localStorage.setItem('app_lang', currentLang);
  applyLang();
};

let me = null, friends = [], incoming = [], outgoing = [], msgs = new Map(), current = null;
let mediaRecorder = null, audioChunks = [], isRecording = false;
let peerConn = null, localStream = null;

function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('on');
  setTimeout(()=>t.classList.remove('on'), 3000);
}

function show(id){ ['auth','app'].forEach(x => $(x).hidden = (x !== id)); }

/* ---------- 登录 / 注册 ---------- */
let authMode = 'login';
$('tabLogin').onclick = () => { authMode = 'login';$('tabLogin').classList.add('on'); $('tabSignup').classList.remove('on');$('signupOnly').hidden = $('inviteWrap').hidden = true; $('authBtn').textContent = i18n[currentLang].login; };
$('tabSignup').onclick = () => { authMode = 'signup';$('tabSignup').classList.add('on'); $('tabLogin').classList.remove('on');$('signupOnly').hidden = $('inviteWrap').hidden = false; $('authBtn').textContent = i18n[currentLang].signup; };

$('authBtn').onclick = async () => {
  const email = $('email').value.trim(), pw =$('pw').value;
  if(!email || !pw) return toast("Please fill email and password");
  if(authMode === 'login'){
    const {data, error} = await sb.auth.signInWithPassword({email, password: pw});
    if(error) return toast(error.message);
    boot(data.user);
  } else {
    const username = $('suUser').value.trim().toLowerCase(), invite =$('invite').value.trim();
    const {data: chk} = await sb.rpc('check_signup', {u: username, invite: invite});
    if(chk !== 'ok') return toast("Signup failed: " + chk);
    const {data, error} = await sb.auth.signUp({email, password: pw, options: {data: {username, invite}}});
    if(error) return toast(error.message);
    boot(data.user);
  }
};

async function boot(user){
  const {data: p} = await sb.from('profiles').select('*').eq('id', user.id).single();
  me = p;
  $('meName').textContent = '@' + p.username;
  renderAvatar(p.avatar_url, $('myAvatar'),$('myAvatarTxt'), p.username);
  show('app');
  applyLang();
  loadFriendships();
  subscribeRealtime();
}

function renderAvatar(url, imgEl, txtEl, name){
  if(url){
    imgEl.src = url; imgEl.style.display = 'block'; txtEl.style.display = 'none';
  } else {
    imgEl.style.display = 'none'; txtEl.style.display = 'grid';
    txtEl.textContent = (name || '?').charAt(0).toUpperCase();
  }
}

/* ---------- 修改头像 ---------- */
$('btnChangeAv').onclick = () => $('fileAvatar').click();$('fileAvatar').onchange = async (e) => {
  const file = e.target.files[0];
  if(!file) return;
  const ext = file.name.split('.').pop();
  const path = `avatars/${me.id}_${Date.now()}.${ext}`;
  const {error} = await sb.storage.from('attachments').upload(path, file);
  if(error) return toast("Avatar upload failed");
  const {data} = sb.storage.from('attachments').getPublicUrl(path);
  const avatarUrl = data.publicUrl;
  await sb.from('profiles').update({avatar_url: avatarUrl}).eq('id', me.id);
  me.avatar_url = avatarUrl;
  renderAvatar(avatarUrl, $('myAvatar'),$('myAvatarTxt'), me.username);
  toast("Avatar updated!");
};

/* ---------- 好友与列表 ---------- */
async function loadFriendships(){
  const {data: rows} = await sb.from('friendships').select('*');
  if(!rows) return;
  const ids = [...new Set(rows.flatMap(r => [r.requester, r.addressee]).filter(i => i !== me.id))];
  const {data: profiles} = await sb.from('profiles').select('*').in('id', ids.length ? ids : ['00000000-0000-0000-0000-000000000000']);
  const pMap = new Map((profiles || []).map(p => [p.id, p]));
  friends = []; incoming = []; outgoing = [];
  rows.forEach(r => {
    const otherId = r.requester === me.id ? r.addressee : r.requester;
    const p = pMap.get(otherId) || {id: otherId, username: 'Unknown'};
    if(r.status === 'accepted') friends.push({...p, fid: r.id});
    else if(r.addressee === me.id) incoming.push({...p, fid: r.id});
    else outgoing.push({...p, fid: r.id});
  });
  renderSide();
}

function renderSide(){
  const box = $('sideScroll'); box.innerHTML = '';
  friends.forEach(f => {
    const btn = document.createElement('button'); btn.className = 'item' + (current === f.id ? ' active' : '');
    btn.innerHTML = `<div class="av-container" style="width:36px;height:36px"><div class="av">${f.username[0].toUpperCase()}</div></div>
      <div class="mid"><div class="nm"><b>${f.username}</b></div><div class="pv"><span>@${f.username}</span></div></div>`;
    btn.onclick = () => openChat(f);
    box.appendChild(btn);
  });
}

function openChat(f){
  current = f.id;
  $('chatEmpty').hidden = true; $('chatBox').style.display = 'flex';
  $('chatName').textContent = f.username; $('chatUser').textContent = '@' + f.username;
  renderAvatar(f.avatar_url, $('chatAvImg'),$('chatAvTxt'), f.username);
  loadMessages();
  renderSide();
}

/* ---------- 消息收发与富媒体 ---------- */
async function loadMessages(){
  const {data} = await sb.from('messages').select('*').or(`and(sender.eq.${me.id},receiver.eq.${current}),and(sender.eq.${current},receiver.eq.${me.id})`).order('id', {ascending: true});
  msgs.set(current, data || []);
  renderChat();
}

function renderChat(){
  const box = $('msgs'); box.innerHTML = '';
  const arr = msgs.get(current) || [];
  arr.forEach(m => {
    const mine = m.sender === me.id;
    const row = document.createElement('div'); row.className = `row-m ${mine ? 'mine' : 'them'}`;
    let body = '';
    if(m.msg_type === 'image') body = `<img src="${m.media_url}" class="chat-img" onclick="window.open('${m.media_url}')">`;
    else if(m.msg_type === 'audio') body = `<audio controls src="${m.media_url}"></audio>`;
    else body = `<div class="bubble">${m.content}</div>`;
    row.innerHTML = `${body}<time>${new Date(m.created_at).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</time>`;
    box.appendChild(row);
  });
  box.scrollTop = box.scrollHeight;
}

$('btnSend').onclick = async () => {
  const text = $('input').value.trim();
  if(!text || !current) return;
  $('input').value = '';
  await sb.from('messages').insert({sender: me.id, receiver: current, content: text, msg_type: 'text'});
  loadMessages();
};

/* 图片发送 */
$('btnSendImg').onclick = () => $('fileImage').click();$('fileImage').onchange = async (e) => {
  const file = e.target.files[0];
  if(!file || !current) return;
  const path = `chat/${me.id}_${Date.now()}_${file.name}`;
  await sb.storage.from('attachments').upload(path, file);
  const {data} = sb.storage.from('attachments').getPublicUrl(path);
  await sb.from('messages').insert({sender: me.id, receiver: current, content: '[Picture]', msg_type: 'image', media_url: data.publicUrl});
  loadMessages();
};

/* 语音消息录制 */
$('btnRecordAudio').onclick = async () => {
  if(!isRecording){
    const stream = await navigator.mediaDevices.getUserMedia({audio: true});
    mediaRecorder = new MediaRecorder(stream); audioChunks = [];
    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
    mediaRecorder.onstop = async () => {
      const blob = new Blob(audioChunks, {type: 'audio/webm'});
      const path = `audio/${me.id}_${Date.now()}.webm`;
      await sb.storage.from('attachments').upload(path, blob);
      const {data} = sb.storage.from('attachments').getPublicUrl(path);
      await sb.from('messages').insert({sender: me.id, receiver: current, content: '[Voice]', msg_type: 'audio', media_url: data.publicUrl});
      loadMessages();
    };
    mediaRecorder.start(); isRecording = true;
    $('btnRecordAudio').style.background = 'var(--danger)';
    toast("Recording... Click again to stop & send");
  } else {
    mediaRecorder.stop(); isRecording = false;
    $('btnRecordAudio').style.background = 'transparent';
  }
};

/* ---------- 视讯通话 (WebRTC + Supabase Realtime) ---------- */
$('btnAudioCall').onclick = () => startCall('audio');$('btnVideoCall').onclick = () => startCall('video');

async function startCall(type){
  $('callModal').hidden = false;
  $('callTitle').textContent = type === 'video' ? 'Video Call' : 'Voice Call';
  localStream = await navigator.mediaDevices.getUserMedia({video: type === 'video', audio: true});
  if(type === 'video'){ $('videoArea').hidden = false; $('localVideo').srcObject = localStream; }
}
$('btnEndCall').onclick = () => {$('callModal').hidden = true; if(localStream) localStream.getTracks().forEach(t=>t.stop()); };

function subscribeRealtime(){
  sb.channel('realtime_chats')
    .on('postgres_changes', {event: 'INSERT', schema: 'public', table: 'messages'}, payload => {
      if(current && (payload.new.sender === current || payload.new.sender === me.id)) loadMessages();
    }).subscribe();
}

/* 初始化启动 */
applyLang();
sb.auth.getSession().then(({data}) => { if(data.session) boot(data.session.user); });

})();
</script>
</body>
